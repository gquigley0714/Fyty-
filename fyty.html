<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYTY | For You, To You</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F9F8F3;
            --light-grey: #E0E0E0;
            --medium-grey: #888888;
            --black: #1A1A1A;
            --soft-blue: #A3C1DA;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--cream); color: var(--black); margin: 0; padding: 20px; line-height: 1.5; }

        /* Navigation */
        nav { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; }
        .nav-btn { background: none; border: 2px solid var(--black); padding: 10px 20px; cursor: pointer; font-weight: 600; transition: 0.3s; border-radius: 4px; }
        .nav-btn.active { background: var(--black); color: var(--cream); }

        .page { display: none; max-width: 950px; margin: 0 auto; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .page.active { display: block; }

        /* Components */
        .card { background: var(--white); border: 1px solid var(--light-grey); padding: 25px; border-radius: 8px; box-shadow: 4px 4px 0px var(--light-grey); margin-bottom: 20px; }
        h3, h4 { margin-top: 0; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        select { border: 1px solid var(--light-grey); padding: 12px; border-radius: 4px; background: var(--cream); font-size: 0.9rem; }
        
        .btn-blue { background: var(--soft-blue); border: 2px solid var(--black); padding: 18px; width: 100%; cursor: pointer; font-weight: 800; font-size: 1rem; transition: 0.2s; box-shadow: 3px 3px 0px var(--black); }
        .btn-blue:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--black); }

        /* Workout Display */
        #workout-display { border-left: 8px solid var(--soft-blue); }
        .exercise-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--light-grey); }
        .form-link { color: var(--black); text-decoration: none; font-size: 0.7rem; font-weight: 800; border: 1.5px solid var(--black); padding: 5px 10px; border-radius: 4px; background: var(--soft-blue); }

        /* Tracker */
        .stats-dash { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--black); color: var(--cream); padding: 20px; text-align: center; border-radius: 8px; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day { aspect-ratio: 1; border: 1px solid var(--light-grey); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; border-radius: 4px; }
        .day.today { border: 3px solid var(--black); font-weight: 900; }
        .day.workout { background-color: var(--soft-blue); }
        .day.rest { border: 2px dashed var(--medium-grey); color: var(--medium-grey); }

        /* Consistency Map */
        .heatmap-scroll { overflow-x: auto; padding: 15px; border: 1px solid var(--light-grey); background: #fff; border-radius: 8px; }
        .heatmap-grid { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 4px; width: max-content; }
        .dot { width: 12px; height: 12px; background: #eeeeee; border-radius: 2px; cursor: pointer; }
        .dot.active { background: var(--soft-blue); }
        .dot.rest { background: var(--medium-grey); }

        /* Modal */
        #log-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--cream); padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; border: 3px solid var(--black); }
        
        #quote-box { font-style: italic; color: var(--black); margin-bottom: 20px; border-left: 4px solid var(--soft-blue); padding-left: 15px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <nav>
        <button class="nav-btn active" onclick="showPage('generator', event)">WORKOUT</button>
        <button class="nav-btn" onclick="showPage('tracker', event)">2026 LEGACY</button>
    </nav>

    <div id="generator" class="page active">
        <div class="card">
            <div id="quote-box">"Consistency is the only secret."</div>
            <h3>Infinite Shuffle Engine</h3>
            <div class="options-grid">
                <div>
                    <label style="font-weight: 800; font-size: 0.7rem;">TARGET AREAS</label><br>
                    <select id="target" multiple style="width: 100%; height: 100px; margin-top: 8px;">
                        <option value="Full Body" selected>Full Body</option>
                        <option value="Upper Body">Upper Body</option>
                        <option value="Lower Body">Lower Body</option>
                        <option value="Core">Core</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight: 800; font-size: 0.7rem;">TRAINING MODE</label><br>
                    <select id="mode" style="width: 100%; margin-top: 8px;">
                        <option value="Bodyweight">Calisthenics (Bodyweight)</option>
                        <option value="Dumbbell">Weighted (Dumbbells)</option>
                        <option value="Pilates">Pilates & Mobility</option>
                    </select>
                </div>
            </div>
            <button class="btn-blue" onclick="generateWorkout()">GENERATE 60-MIN PROTOCOL</button>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button onclick="logLifeHappens()" style="flex: 1; background: var(--light-grey); border: none; cursor: pointer; padding: 12px; font-weight: bold; border-radius: 4px;">Life Happens</button>
                <button onclick="openManualLog()" style="flex: 1; background: var(--black); color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px;">Manual Log</button>
            </div>
        </div>

        <div id="workout-display" class="card" style="display: none;"></div>
    </div>

    <div id="tracker" class="page">
        <div class="stats-dash">
            <div class="stat-box">
                <small>WORKOUTS</small>
                <div id="stat-workouts" style="font-size: 2rem; font-weight: 800;">0</div>
            </div>
            <div class="stat-box">
                <small>REST DAYS</small>
                <div id="stat-rest" style="font-size: 2rem; font-weight: 800;">0</div>
            </div>
        </div>

        <div class="card">
            <h4 id="calendar-month">January 2026</h4>
            <div class="calendar-grid" id="calendar"></div>
        </div>

        <div class="card">
            <h4>2026 Legacy Heatmap</h4>
            <div class="heatmap-scroll">
                <div class="heatmap-grid" id="heatmap"></div>
            </div>
        </div>
    </div>

    <div id="log-modal">
        <div class="modal-content">
            <h3 id="modal-date">Date</h3>
            <div id="modal-body" style="margin: 20px 0; max-height: 300px; overflow-y: auto;"></div>
            <div style="display:flex; gap:10px;">
                <button onclick="deleteEntry()" style="background: #e74c3c; color: white; border: none; padding: 12px; cursor: pointer; flex: 1; font-weight: bold; border-radius: 4px;">Delete Log</button>
                <button onclick="closeModal()" style="background: var(--medium-grey); color: white; border: none; padding: 12px; cursor: pointer; flex: 1; border-radius: 4px;">Back</button>
            </div>
        </div>
    </div>

    <script>
        // --- 100+ EXERCISE LIBRARY ---
        const exercises = {
            Bodyweight: {
                Upper: ["Pushups", "Diamond Pushups", "Wide Pushups", "Dips", "Pike Pushups", "Chin Ups", "Pull Ups", "Plank Ups", "Hindu Pushups", "Burpees", "Superman Throws", "Wall Walks", "Pseudo Planche Pushups", "Decline Pushups"],
                Lower: ["Air Squats", "Forward Lunges", "Reverse Lunges", "Bulgarian Split Squats", "Jump Squats", "Glute Bridges", "Calf Raises", "Pistol Squats", "Step Ups", "Side Lunges", "Wall Sit", "Frog Jumps", "Single Leg Bridge", "Sumo Squats", "Curtsy Lunges"],
                Core: ["Plank", "Side Plank", "Mountain Climbers", "Bicycle Crunches", "Leg Raises", "Russian Twists", "V-Ups", "Hollow Body Hold", "Flutter Kicks", "Dead Bugs", "Plank Jacks", "Reverse Crunches", "Toe Touches", "Bird-Dog Crunch"]
            },
            Dumbbell: {
                Upper: ["Chest Press", "Overhead Press", "Bicep Curls", "Tricep Kickbacks", "Lateral Raises", "Bent Over Rows", "Hammer Curls", "Arnold Press", "Chest Flyes", "Front Raises", "Shrugs", "Renegade Rows", "Push Press", "Floor Press", "Upright Rows"],
                Lower: ["Goblet Squats", "Dumbbell Deadlifts", "Weighted Lunges", "Step Ups", "Dumbbell Swings", "Stiff Leg Deadlift", "Thrusters", "Weighted Calf Raise", "Box Squats", "Romanian Deadlift", "Side Squats", "Weighted Bridge"],
                Core: ["Weighted Russian Twist", "Dumbbell Side Bend", "Woodchoppers", "Weighted Plank", "Dumbbell Leg Lowers", "Halos", "Weighted Sit Ups"]
            },
            Pilates: {
                Full: ["The Hundred", "Single Leg Stretch", "Double Leg Stretch", "Scissors", "Criss Cross", "Pelvic Tilt", "Shoulder Bridge", "Swan Dive", "Swimming", "Leg Pull Front", "Side Kick Series", "Teaser", "Seal", "Mermaid Stretch", "Spine Twist", "Saw", "Corkscrew", "Roll Up", "Rolling Like a Ball", "Leg Circles"]
            }
        };

        const quotes = [
            "Motivation gets you started. Habit keeps you going.",
            "Your body is the only house you have to live in. Take care of it.",
            "A one-hour workout is only 4% of your day. No excuses.",
            "The hardest lift is lifting your body off the couch.",
            "Strength does not come from winning. It comes from your struggles.",
            "You don't have to be great to start, but you have to start to be great."
        ];

        let logs = JSON.parse(localStorage.getItem('fyty_logs')) || {};
        let selectedDate = "";

        // --- NAVIGATION ---
        function showPage(id, e) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(e) e.target.classList.add('active');
            if(id === 'tracker') renderTracker();
        }

        // --- ENGINE ---
        function generateWorkout() {
            const mode = document.getElementById('mode').value;
            const targets = Array.from(document.getElementById('target').selectedOptions).map(o => o.value);
            let pool = [];

            if (mode === "Pilates") {
                pool = exercises.Pilates.Full;
            } else {
                targets.forEach(t => {
                    if (t === "Full Body") {
                        pool = [...pool, ...exercises[mode].Upper, ...exercises[mode].Lower, ...exercises[mode].Core];
                    } else if (t === "Upper Body") pool = [...pool, ...exercises[mode].Upper];
                    else if (t === "Lower Body") pool = [...pool, ...exercises[mode].Lower];
                    else if (t === "Core") pool = [...pool, ...exercises[mode].Core];
                });
            }

            let shuffled = pool.sort(() => 0.5 - Math.random()).slice(0, 7);
            
            let html = `<h3>The 60-Minute Protocol</h3>
                <p><strong>00:00 - 05:00:</strong> Dynamic Warmup (Active Stretching)</p>
                <div style="margin: 15px 0; border-top: 1px solid var(--light-grey);">`;

            shuffled.forEach(ex => {
                html += `<div class="exercise-item">
                    <span><strong>${ex}</strong><br><small>4 Sets • 10-15 Reps (Slow Tempo)</small></span>
                    <a href="https://www.youtube.com/results?search_query=how+to+do+${ex}+form" target="_blank" class="form-link">FORM ▶</a>
                </div>`;
            });

            html += `</div><p><strong>55:00 - 60:00:</strong> Static Recovery & Mobility</p>
            <button class="btn-blue" onclick="logWorkout('${mode}: ${shuffled.join(', ')}')">LOG COMPLETED WORKOUT</button>`;

            const display = document.getElementById('workout-display');
            display.innerHTML = html;
            display.style.display = 'block';
            document.getElementById('quote-box').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
        }

        // --- TRACKING ---
        function logWorkout(details) {
            const date = new Date().toISOString().split('T')[0];
            logs[date] = { type: 'workout', details, time: new Date().toLocaleTimeString() };
            save();
        }

        function logLifeHappens() {
            const date = new Date().toISOString().split('T')[0];
            logs[date] = { type: 'rest', details: 'Life Happens / Rest', time: new Date().toLocaleTimeString() };
            save();
        }

        function openManualLog() {
            const act = prompt("What did you do today?");
            if(act) {
                const date = new Date().toISOString().split('T')[0];
                logs[date] = { type: 'workout', details: `Manual: ${act}`, time: "Manual" };
                save();
            }
        }

        function save() {
            localStorage.setItem('fyty_logs', JSON.stringify(logs));
            alert("Entry Saved.");
            renderTracker();
        }

        function renderTracker() {
            const cal = document.getElementById('calendar');
            const heat = document.getElementById('heatmap');
            cal.innerHTML = ""; heat.innerHTML = "";
            let wCount = 0, rCount = 0;

            // Month View
            const daysInMonth = new Date(2026, new Date().getMonth() + 1, 0).getDate();
            for(let i=1; i<=daysInMonth; i++) {
                const dStr = `2026-${(new Date().getMonth()+1).toString().padStart(2, '0')}-${i.toString().padStart(2, '0')}`;
                const day = document.createElement('div');
                day.className = 'day';
                day.innerText = i;
                if(dStr === new Date().toISOString().split('T')[0]) day.classList.add('today');
                if(logs[dStr]) day.classList.add(logs[dStr].type === 'workout' ? 'workout' : 'rest');
                day.onclick = () => inspectDay(dStr);
                cal.appendChild(day);
            }

            // Heatmap
            const start = new Date('2026-01-01');
            for(let i=0; i<365; i++) {
                const d = new Date(start); d.setDate(start.getDate() + i);
                const dStr = d.toISOString().split('T')[0];
                const dot = document.createElement('div');
                dot.className = 'dot';
                if(logs[dStr]) {
                    dot.classList.add(logs[dStr].type === 'workout' ? 'active' : 'rest');
                    logs[dStr].type === 'workout' ? wCount++ : rCount++;
                }
                dot.onclick = () => inspectDay(dStr);
                heat.appendChild(dot);
            }
            document.getElementById('stat-workouts').innerText = wCount;
            document.getElementById('stat-rest').innerText = rCount;
        }

        function inspectDay(date) {
            selectedDate = date;
            document.getElementById('modal-date').innerText = date;
            const entry = logs[date];
            document.getElementById('modal-body').innerHTML = entry 
                ? `<p><strong>Time:</strong> ${entry.time}</p><p><strong>Summary:</strong> ${entry.details}</p>`
                : `<p>No activity logged.</p><button onclick="manualAdd('${date}')" style="width:100%; padding:10px;">+ Log Missed Day</button>`;
            document.getElementById('log-modal').style.display = 'flex';
        }

        function manualAdd(date) {
            const task = prompt("Workout name:");
            if(task) { logs[date] = { type: 'workout', details: task, time: "Manual Entry" }; save(); closeModal(); }
        }

        function deleteEntry() {
            if(confirm("Delete this log?")) { delete logs[selectedDate]; save(); closeModal(); }
        }

        function closeModal() { document.getElementById('log-modal').style.display = 'none'; }
    </script>
</body>
</html>
